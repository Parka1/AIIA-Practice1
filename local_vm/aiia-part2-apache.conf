<VirtualHost *:80>
    ServerName _
    ProxyPreserveHost On
    ProxyTimeout 120
    LimitRequestBody 15728640
    ProxyPass / http://127.0.0.1:8765/ connectiontimeout=5 timeout=120 retry=0
    ProxyPassReverse / http://127.0.0.1:8765/
    ErrorLog ${APACHE_LOG_DIR}/aiia-part2-error.log
    CustomLog ${APACHE_LOG_DIR}/aiia-part2-access.log combined
</VirtualHost>
